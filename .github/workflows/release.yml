name: Release

on:
  push:
    branches: [main]
  # Or gate on tags instead:
  # push:
  #   tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-push:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: meta
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- Platform deploys: each gated on its secret, so you enable them one at a
  # time. A failure in one does not cascade to the others. ---

  deploy-fly:
    name: Deploy to Fly.io
    needs: build-push
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard on FLY_API_TOKEN
        id: guard
        run: |
          if [ -n "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup flyctl
        if: steps.guard.outputs.enabled == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        if: steps.guard.outputs.enabled == 'true'
        run: flyctl deploy --config deploy/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-cloud-run:
    name: Deploy to Cloud Run
    needs: build-push
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard on GCP_SA_KEY
        id: guard
        run: |
          if [ -n "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate to Google Cloud
        if: steps.guard.outputs.enabled == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up gcloud
        if: steps.guard.outputs.enabled == 'true'
        uses: google-github-actions/setup-gcloud@v2
      - name: Run migration job + deploy revision
        if: steps.guard.outputs.enabled == 'true'
        run: |
          gcloud run jobs execute comfort-stack-migrate --region "${GCP_REGION:-asia-southeast1}" --wait
          gcloud run services replace deploy/cloudrun.service.yaml --region "${GCP_REGION:-asia-southeast1}"
        env:
          GCP_REGION: ${{ secrets.GCP_REGION }}
