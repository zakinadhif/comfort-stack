apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: comfort-stack
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1" # set "0" for scale-to-zero
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: ghcr.io/OWNER/comfort-stack:latest # replace OWNER
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            failureThreshold: 10
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            # All secrets come from a Secret Manager secret named
            # "comfort-stack-secrets" with one key per variable.
            - name: APP_URL
              valueFrom:
                secretKeyRef:
                  name: comfort-stack-secrets
                  key: APP_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: comfort-stack-secrets
                  key: DATABASE_URL
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: comfort-stack-secrets
                  key: BETTER_AUTH_SECRET
            - name: STORAGE_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: comfort-stack-secrets
                  key: STORAGE_ENDPOINT
            - name: STORAGE_REGION
              valueFrom:
                secretKeyRef:
                  name: comfort-stack-secrets
                  key: STORAGE_REGION
            - name: STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: comfort-stack-secrets
                  key: STORAGE_ACCESS_KEY
            - name: STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: comfort-stack-secrets
                  key: STORAGE_SECRET_KEY
            - name: STORAGE_BUCKET
              valueFrom:
                secretKeyRef:
                  name: comfort-stack-secrets
                  key: STORAGE_BUCKET
# Migrations: run as a Cloud Run Job (same image, command override
# `node dist/scripts/migrate.js`) from the deploy pipeline BEFORE routing
# traffic to the new revision. Do not run them inside the service.
