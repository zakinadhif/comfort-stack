# Local development backing services: Postgres + MinIO (S3-compatible).
# Run the app itself with `pnpm dev:api` / `pnpm dev:app` against these.
#
#   docker compose -f deploy/docker-compose.dev.yml up -d
#
# Then in apps/api/.env:
#   DATABASE_URL=postgres://comfort:comfort@localhost:5432/comfort
#   STORAGE_ENDPOINT=http://localhost:9000  (access/secret = minioadmin)

name: comfort-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: comfort
      POSTGRES_PASSWORD: comfort
      POSTGRES_DB: comfort
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comfort -d comfort"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the dev bucket, then exit.
  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/comfort-dev;
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
